<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Debug</title>
<style>
:root{--cyan:#58ff9a;--pink:#ff4f70;--ink:#07110d;--paper:#dfffe9}
*{box-sizing:border-box} body{margin:0;font-family:"Courier New",monospace;color:#10233e;background:#07110d;overflow:hidden}
body:after{content:"";pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(10,30,50,.05) 0 1px,transparent 1px 4px);z-index:100}
.screen{height:100vh;display:flex;flex-direction:column;position:relative}
.sky{height:42%;background:linear-gradient(#07110d,#0b2118);position:relative;transition:.8s}
.ocean{flex:1;background:linear-gradient(#0a271b,#07150f 70%,#020805);position:relative;transition:background 1s}
.wave{position:absolute;top:-16px;left:-5%;width:110%;height:35px;background:#123c2a;border-radius:50%;animation:wave 4s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(8px) rotate(-.4deg)}}
header{text-align:center;position:absolute;top:5%;width:100%;z-index:2}
.logo{font-size:clamp(38px,7vw,92px);font-weight:900;letter-spacing:.14em;color:white;text-shadow:-5px 3px rgba(255,79,112,.65),5px -3px rgba(88,255,154,.65)}
.sub{letter-spacing:.55em;color:#58ff9a;font-size:clamp(14px,2vw,28px);margin-top:24px}
.card{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:4%;width:min(900px,90%);background:rgba(8,25,49,.95);border:5px solid var(--cyan);color:white;padding:28px;box-shadow:0 10px 0 rgba(20,150,190,.35)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:#10213f;color:white;border:2px solid var(--cyan);padding:14px 20px;letter-spacing:.15em;font-weight:bold; transition: transform 0.1s, background 0.2s; position:relative; overflow:hidden;}
button:hover{background:#18345e; transform: translateY(-2px);}
button:active{transform: translateY(4px); box-shadow: none;}
.primary{width:100%;font-size:clamp(20px,3vw,36px);padding:25px}
.settings{display:none;max-height:78vh;overflow:auto;bottom:8%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;letter-spacing:.08em}
input,select,textarea{padding:10px;background:#dffaff;color:#0c1a32;border:0; outline: none; transition: box-shadow 0.2s;}
input:focus, textarea:focus { box-shadow: 0 0 15px var(--cyan); }
.full{grid-column:1/-1}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}
.gear{position:absolute;right:20px;top:20px;z-index:8;width:52px;height:52px;font-size:23px;padding:0}

/* Background now explicitly supports layered rendering */
.game{display:none;position:absolute;inset:0;z-index:6;color:white;text-align:center;background-color:#07110d;}
.gameInner{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8%; position:relative; z-index:3;}
.gameInner > * { position: relative; z-index: 4; }
.depth{position:absolute;right:4%;top:8%;font-size:20px; text-align:right; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
#depthStatus { font-size: 13px; letter-spacing: 0.2em; display: block; margin-top: 4px; font-weight: bold; transition: color 1s; }
.round{letter-spacing:.35em;color:var(--cyan);margin-bottom:25px}
.prompt{font-size:clamp(24px,4vw,55px);max-width:1000px;font-weight:bold;line-height:1.25; transform-origin: center;}
.timer{font-size:clamp(45px,8vw,100px);margin:35px;color:var(--cyan); transition: transform 0.1s;}
.controls{display:flex;gap:12px}.end{display:none}
.small{font-size:12px;opacity:.7;margin-top:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}.logo{letter-spacing:.06em}}

/* Grid layers dynamically stack over time */
.terminalGrid{pointer-events:none;position:fixed;inset:0;z-index:1;opacity:.3;}
.statusbar{position:fixed;left:18px;top:18px;z-index:7;color:#58ff9a;font-size:12px;letter-spacing:.12em}
.statusbar b{animation:blink 1.1s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.prompt:before{content:"NAME IT // ";display:block;color:#58ff9a;font-size:13px;letter-spacing:.25em;margin-bottom:18px}

.game{overflow-y:auto}.gameInner{min-height:100%;height:auto;padding:85px 6% 40px}.prompt{font-size:clamp(21px,3vw,36px)}.timer{font-size:52px;margin:16px}.controls{flex-wrap:wrap;justify-content:center}.answerPanel{width:min(760px,100%);text-align:left;margin-bottom:18px; position:relative;}.answerPanel textarea{width:100%;resize:vertical;min-height:90px}.feedback{min-height:64px;margin:14px 0;line-height:1.6; font-weight: bold; text-shadow: 0 0 10px currentColor; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}.badge{font-weight:bold;font-size:24px}.rule{font-size:12px;line-height:1.6;opacity:.8}button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none;}.results{text-align:left;max-width:800px}.resultRow{border-top:1px solid #42705c;padding:14px 0;overflow-wrap:anywhere}details{margin:12px 0}#startCard{max-height:65vh;overflow:auto}@media(max-width:600px){.logo{font-size:32px}.sub{letter-spacing:.12em;font-size:13px}.statusbar{font-size:9px}.gameInner{padding-top:90px}.controls button{padding:12px;font-size:12px}}

.results{width:100%;overflow-x:auto;margin:18px auto}.end{width:min(960px,100%)}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}caption{text-align:left;color:var(--cyan);padding:12px 0;letter-spacing:.1em}th,td{padding:12px 10px;border-bottom:1px solid #37657a;overflow-wrap:anywhere;min-width:65px}th{color:var(--cyan);background:#071b31}tbody tr:first-child{background:rgba(88,255,154,.07)}#endDepth{font-size:24px;color:var(--cyan)}

details.answer-reveal { margin: 10px 0; background: rgba(8,25,49,.5); border: 1px solid #42705c; }
details.answer-reveal summary { padding: 12px; cursor: pointer; color: var(--cyan); font-weight: bold; background: #071b31; outline: none; }
details.answer-reveal summary:hover { background: #0a2746; }
.reveal-tier { display: flex; padding: 10px 12px; border-top: 1px solid #1a3a4d; font-size: 13px; line-height: 1.4; }
.reveal-tier-name { width: 110px; font-weight: bold; flex-shrink: 0; }
.reveal-tier-items { color: #dfffe9; opacity: 0.9; }

/* --- JUICE UPGRADES --- */
@keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(-4px, -4px) rotate(-1deg); }
    30% { transform: translate(4px, 4px) rotate(1deg); }
    50% { transform: translate(-4px, 2px) rotate(-1deg); }
    70% { transform: translate(4px, -2px) rotate(1deg); }
    90% { transform: translate(-2px, 4px) rotate(0deg); }
}
.shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; filter: contrast(120%); }

@keyframes coreGlitch {
    0% { transform: translate(0); filter: hue-rotate(0deg); }
    20% { transform: translate(-2px, 2px); filter: hue-rotate(-10deg); }
    40% { transform: translate(-1px, -2px); }
    60% { transform: translate(2px, 1px); filter: hue-rotate(10deg); }
    80% { transform: translate(1px, -1px); }
    100% { transform: translate(0); filter: hue-rotate(0deg); }
}
/* FIXED: Stopped this from shaking infinitely! Now it only pulses 5 times over 1 second */
.core-active { animation: coreGlitch 0.2s 5; } 

@keyframes popIn {
    0% { opacity: 0; transform: scale(0.9) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}
.pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

@keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
    10% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -100px) scale(1); }
}
.floating-points {
    position: absolute; left: 50%; top: -20px;
    font-weight: 900; font-size: 48px; z-index: 100;
    pointer-events: none; text-shadow: 0px 4px 15px currentColor, 0 0 5px #000;
    animation: floatUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes pulseDanger {
    0% { transform: scale(1); color: var(--pink); text-shadow: 0 0 10px var(--pink); }
    100% { transform: scale(1.15); color: #ff1a40; text-shadow: 0 0 20px #ff1a40; }
}
.timer-danger { animation: pulseDanger 0.25s infinite alternate; font-weight: 900; }

#flashOverlay {
    position: fixed; inset: 0; z-index: 99; pointer-events: none; opacity: 0;
    transition: opacity 0.4s ease-out, background 0s; mix-blend-mode: color-dodge;
}
.flash-active { opacity: 0.35 !important; transition: none !important; }

#sec-bg {
    position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;
}
@keyframes bgTextPulse {
    0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; letter-spacing: 0.1em; }
    20% { opacity: 0.08; letter-spacing: 0.3em; filter: blur(2px); }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; letter-spacing: 0.6em; filter: blur(15px); }
}
.sec-bg-text {
    position: absolute; left: 50%; top: 50%; font-size: clamp(50px, 8vw, 120px); font-weight: 900;
    white-space: nowrap; animation: bgTextPulse 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes shieldPulse {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; filter: drop-shadow(0 0 10px currentColor); stroke-width: 2; }
    15% { transform: translate(-50%, -50%) scale(calc(var(--scale-target) * 0.4)); opacity: 0.25; filter: drop-shadow(0 0 30px currentColor); stroke-width: 1.5; }
    100% { transform: translate(-50%, -50%) scale(var(--scale-target)); opacity: 0; filter: drop-shadow(0 0 50px currentColor); stroke-width: 0.2; }
}
.shield-icon {
    position: absolute; left: 50%; top: 50%; width: 100px; height: 100px; fill: none; stroke: currentColor;
    animation: shieldPulse 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* PERSISTENT LOOPING DATA RAIN */
@keyframes continuousDrift {
    0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
    10% { opacity: 0.4; text-shadow: 0 0 10px currentColor; }
    90% { opacity: 0.4; text-shadow: 0 0 15px currentColor; }
    100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
}
.persistent-particle {
    position: absolute; top: 0; font-family: monospace; font-weight: bold; opacity: 0;
    animation: continuousDrift var(--duration) linear infinite;
    z-index: 1; pointer-events: none;
}
</style></head>
<body>
<div id="flashOverlay"></div>
<div class="terminalGrid" id="terminalGrid"></div><div class="statusbar"><b>●</b>  &nbsp;&nbsp; </div>
<div class="screen" id="home">

<div class="sky"><header><div class="logo">SECURITY DEBUG</div><div class="sub">SECURITY QUICK-FIRE</div></header></div>
<div class="ocean"><div class="wave"></div></div>
<div class="card" id="startCard">
<div style="text-align:center;letter-spacing:.15em;margin-bottom:20px" id="summary">10 PROMPTS · 25 SECONDS EACH · ANSWER · COLLECT RARITIES</div>
<div class="grid" style="margin-bottom:20px">
<label>YOUR NAME<input id="players" placeholder="Enter your name" autocomplete="given-name" maxlength="80"></label>
<label>SCENARIO TYPE<select id="category"><option value="mixed">Mixed Security</option><option value="funny">Online Safety</option><option value="deep">Security Tools</option><option value="chaotic">Security Basics</option></select></label>
</div>
<button class="primary" onclick="startGame()">▶ START SECURITY DEBUG ◀</button>
<div class="small">10 quick questions. Type an answer before the timer runs out.</div><div id="homeLeaderboard" class="results" aria-live="polite"></div>
</div>
</div>

<div class="game" id="game">
<div id="sec-bg"></div> 
<div class="depth">
    <span id="scoreText">SCORE 0</span>
    <span id="depthStatus">SURFACE WEB</span>
</div>
<div class="gameInner" id="gameInner">
<div class="round" id="round">QUESTION 1 / 10</div>
<div class="prompt" id="prompt"></div>
<div class="timer" id="timer">25</div>
<div class="answerPanel" id="answerPanel">
<label for="answer">YOUR ANSWER</label>
<textarea id="answer" maxlength="120" placeholder="Type your answer..." oninput="sfxType()" onkeydown="if(event.key==='Enter'){event.preventDefault();submitAnswer()}"></textarea>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
</div>
<div class="controls"><button id="submitAnswer" onclick="submitAnswer()">SUBMIT ANSWER</button></div>
<div class="end" id="end">
    <h1>FINAL SCOREBOARD</h1><p id="endDepth"></p>
    <div id="leaderboard" class="results"></div>
    <h2>YOUR ANSWERS</h2><div id="results" class="results"></div>
    <h2>ALL POSSIBLE ANSWERS</h2><div id="allAnswers" class="results"></div>
    <button onclick="quit()" style="margin-top:20px;">PLAY AGAIN</button>
</div>
</div></div>

<script>
// --- JUICE UPGRADES: AUDIO SYNTHESIS ---
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(type, freq, duration, vol, detune = 0) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq; osc.detune.value = detune;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function sfxType() { initAudio(); playTone('triangle', 300 + Math.random()*200, 0.05, 0.03, (Math.random()-0.5)*100); }
function sfxTick() { initAudio(); playTone('square', 800 + Math.random()*20, 0.05, 0.05); }
function sfxGood(multiplier) { 
    initAudio();
    const baseFreq = 300 + (multiplier * 150);
    playTone('sine', baseFreq, 0.3, 0.15);
    setTimeout(() => playTone('sine', baseFreq * 1.5, 0.5, 0.15), 100);
    setTimeout(() => playTone('triangle', baseFreq * 2, 0.8, 0.1), 200);
}
function sfxBad() { 
    initAudio();
    playTone('sawtooth', 150, 0.4, 0.1, -100);
    setTimeout(() => playTone('sawtooth', 100, 0.5, 0.1, -200), 100);
}

// --- VISUAL JUICE FUNCTIONS ---
function triggerShake() {
    const el = document.getElementById("gameInner");
    el.classList.remove("shake"); 
    void el.offsetWidth; 
    el.classList.add("shake");
    // FIXED: Cleanup the class so it doesn't get stuck indefinitely
    setTimeout(() => el.classList.remove("shake"), 300);
}
function triggerFlash(color) {
    const flash = document.getElementById("flashOverlay");
    flash.style.background = color; flash.classList.add("flash-active");
    setTimeout(() => flash.classList.remove("flash-active"), 50);
}
function spawnPointsText(text, color) {
    const container = document.getElementById("answerPanel");
    const p = document.createElement("div");
    p.textContent = text; p.className = "floating-points"; p.style.color = color;
    container.appendChild(p); setTimeout(() => p.remove(), 1200);
}

// --- DARK WEB LAYER STACKING SYSTEM ---
const depthsConfig = [
    { top: "#0d638f", bottom: "#04152a", grid: "rgba(88,255,154,.25)", name: "SURFACE WEB" },
    { top: "#062b3a", bottom: "#020a14", grid: "rgba(88,255,154,.15)", name: "DEEP WEB PROXY" },
    { top: "#051f15", bottom: "#000000", grid: "rgba(88,255,154,.35)", name: "DARKNET ONION" },
    { top: "#1a0b2e", bottom: "#050011", grid: "rgba(213,160,255,.25)", name: "THE ABYSS" },
    { top: "#1f0000", bottom: "#000000", grid: "rgba(255,79,112,.35)", name: "MARIANA CORE" }
];
const secWords = ["SURFACE NODE", "PROXY SECURED", "ONION ROUTED", "ABYSS UNLOCKED", "CORE OVERRIDE"];
const secIcons = [
    '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke-width="2" fill="none"/>',
    '<rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke-width="2"/><path d="M4 10h16M4 16h16M8 22v-2M16 22v-2" stroke-width="2" fill="none"/>',
    '<circle cx="12" cy="12" r="9" fill="none" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke-width="2"/><circle cx="12" cy="12" r="1" stroke-width="2"/>',
    '<rect x="5" y="10" width="14" height="12" rx="2" fill="none" stroke-width="2"/><path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke-width="2"/><path d="M12 14v4" stroke-width="2"/>',
    '<path d="M12 2a7 7 0 00-7 7v4l2 2v3a2 2 0 002 2h6a2 2 0 002-2v-3l2-2V9a7 7 0 00-7-7zm-3 9a2 2 0 110-4 2 2 0 010 4zm6 0a2 2 0 110-4 2 2 0 010 4z" fill="none" stroke-width="2"/><path d="M10 18v-2h4v2z" stroke-width="2"/>'
];

let bgGradients = [];
let gridGradients = [];
let gridSizes = [];
let gridPositions = [];

function buildBackground(level) {
    if(level < 0 || level > 4) return;
    const target = depthsConfig[level];
    
    // Stack Transparent Color Gradients
    const topAlpha = target.top + "D9"; 
    const botAlpha = target.bottom + "D9";
    bgGradients.unshift(`linear-gradient(${topAlpha}, ${botAlpha})`);
    document.getElementById("game").style.backgroundImage = bgGradients.join(", ");
    
    // Stack Grid Overlays
    const newGrid = `linear-gradient(${target.grid} 1px, transparent 1px), linear-gradient(90deg, ${target.grid} 1px, transparent 1px)`;
    const baseSize = 38 + (level * 12);
    const offset = gridGradients.length * 8; 
    
    gridGradients.unshift(newGrid);
    gridSizes.unshift(`${baseSize}px ${baseSize}px`);
    gridPositions.unshift(`${offset}px ${offset}px`);
    
    const gridEl = document.getElementById("terminalGrid");
    gridEl.style.backgroundImage = gridGradients.join(", ");
    gridEl.style.backgroundSize = gridSizes.join(", ");
    gridEl.style.backgroundPosition = gridPositions.join(", ");
    
    // Update Depth Labels
    const status = document.getElementById("depthStatus");
    status.textContent = target.name; status.style.color = tierColors[level];
    
    // Toggle legendary glitch state
    if(level === 4) { document.getElementById("gameInner").classList.add("core-active"); } 
    else { document.getElementById("gameInner").classList.remove("core-active"); }
}

function triggerSecurityVisual(level, color) {
    const bg = document.getElementById("sec-bg");
    const text = document.createElement("div");
    text.className = "sec-bg-text"; text.textContent = secWords[level] || "VERIFIED"; text.style.color = color; bg.appendChild(text);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.className = "shield-icon";
    svg.style.setProperty('--scale-target', 4 + level * 2.5); svg.style.color = color;
    svg.innerHTML = secIcons[level]; bg.appendChild(svg);
    setTimeout(() => { text.remove(); svg.remove(); }, 1500);
}

function spawnPersistentData(level, color) {
    if (level < 1) return;
    const bg = document.getElementById("sec-bg");
    const count = level * 4; 
    for(let i=0; i<count; i++) {
        const p = document.createElement("div");
        p.className = "persistent-particle"; 
        p.style.color = color;
        p.style.left = (Math.random() * 100) + "%"; 
        p.style.fontSize = (10 + level * 3) + "px"; 
        p.style.setProperty('--duration', (8 + Math.random() * 12) + "s");
        p.style.animationDelay = "-" + (Math.random() * 20) + "s";
        const hex = "0x" + Math.floor(Math.random()*65535).toString(16).toUpperCase();
        p.textContent = level >= 3 ? hex : (Math.random() > 0.5 ? "1" : "0");
        bg.appendChild(p); 
    }
}

// --- ORIGINAL GAME LOGIC ---
const [home,game,round,prompt,timer,scoreText,end,endDepth,summary,category,players]=["home","game","round","prompt","timer","scoreText","end","endDepth","summary","category","players"].map(id=>document.getElementById(id));
const banks={
funny:["Name an antivirus brand.","Name a password manager.","Name a way to lock your phone.","Name a sign of a scam email.","Name something you should keep private online.","Name an app that offers two-step verification.","Name a way to protect your online accounts.","Name a place to store a backup.","Name something a scammer might ask you for.","Name a way to spot a fake website."],
deep:["Name a web browser.","Name a VPN brand.","Name an authenticator app.","Name a device that can use a password.","Name a security tool.","Name a way to unlock a laptop.","Name a type of malware.","Name a way to back up files.","Name a company that makes security software.","Name something a firewall can block."],
chaotic:["Name something a hacker might try to steal.","Name a place you might see a security camera.","Name a way to secure a front door.","Name something you should never share with a stranger.","Name a reason to update your phone.","Name a kind of online scam.","Name something that needs a PIN.","Name a way to protect your Wi-Fi.","Name something you would do if you lost your phone.","Name a person you could tell about a suspicious message."]
};
banks.mixed=[...banks.funny,...banks.deep,...banks.chaotic];
let cfg={}, prompts=[], idx=0, left=0, tick=null, advance=null;
function readCfg(){return {count:10,seconds:25,category:banks[category.value]?category.value:"mixed",players:players.value}}
function saveSettings(){cfg=readCfg();try{localStorage.setItem("deepDive",JSON.stringify(cfg))}catch(e){}summary.textContent="10 QUESTIONS · 25 SECONDS EACH"}
function load(){try{const x=JSON.parse(localStorage.getItem("deepDive")||"{}");if(typeof x.players==="string")players.value=x.players;if(banks[x.category])category.value=x.category}catch(e){}saveSettings()}
function makePrompts(){prompts=[...banks[cfg.category]];for(let i=prompts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[prompts[i],prompts[j]]=[prompts[j],prompts[i]]}prompts=prompts.slice(0,10)}
let total=0, answered=false, history=[], usedAnswers=new Set();
const el=id=>document.getElementById(id);
const answerBank=[

const questionOrder=[...banks.funny,...banks.deep,...banks.chaotic];
const tierNames=["Common","Uncommon","Rare","Epic","Legendary"];
const tierPoints=[10,25,50,75,100];
const tierColors=["#cbd5e1","#58ff9a","#68b8ff","#d5a0ff","#ffda70"];
function normalizeAnswer(value){return value.normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"")}
let scoreSaved=false;
function editDistance(a,b){
 const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
 for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
 }return d[a.length][b.length];
}
function gradeAnswer(value,question=prompts[idx]){
 const key=normalizeAnswer(value), tiers=answerBank[questionOrder.indexOf(question)]||[];
 const entries=tiers.flatMap((group,level)=>group.split("|").map(alias=>({alias,level,key:normalizeAnswer(alias)})));
 let match=key?entries.find(e=>e.key===key):null;
 const words=value.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[];
 const fillers=new Set(["i","would","say","use","a","an","the","my","answer","is","its","it","maybe"]);
 const clean=words.filter(w=>!fillers.has(w));const cleanKey=clean.join("");
 if(!match&&cleanKey)match=entries.find(e=>e.key===cleanKey);
 if(!match&&key){
  const phrase=" "+words.join(" ")+" ";
  const contained=entries.filter(e=>e.key.length>=4&&phrase.includes(" "+(e.alias.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).join(" ")+" "));
  if(contained.length){contained.sort((a,b)=>b.key.length-a.key.length||a.level-b.level);match=contained[0]}
 }
 if(!match&&cleanKey.length>=4){
  const candidates=entries.map(e=>{const distance=editDistance(cleanKey,e.key);const allowed=Math.min(cleanKey.length,e.key.length)>=8?2:1;
   const prefix=Math.min(cleanKey.length,e.key.length)>=5&&(e.key.startsWith(cleanKey)||cleanKey.startsWith(e.key))&&Math.min(cleanKey.length,e.key.length)/Math.max(cleanKey.length,e.key.length)>=.5;
   return {...e,distance,valid:e.key.length>=4&&((distance<=allowed&&distance/Math.max(cleanKey.length,e.key.length)<=.25)||prefix)};
  }).filter(e=>e.valid).sort((a,b)=>a.distance-b.distance||a.level-b.level);
  if(candidates.length)match=candidates[0];
 }
 const level=match?match.level:-1;
 return {level, tier:level<0?(key?"Not in answer bank":"Unanswered"):tierNames[level],points:level<0?0:tierPoints[level],color:level<0?"#ffb6c4":tierColors[level],key:match?match.key:key,matched:match&&match.key!==key?match.alias:""};
}
let sessionScores=[],scoresWritable=true;
function readScores(){
 if(!scoresWritable)return sessionScores;
 try{const saved=JSON.parse(localStorage.getItem("securityDebugScoresV1")||"[]");if(Array.isArray(saved))sessionScores=saved.filter(x=>x&&typeof x.name==="string"&&Number.isFinite(x.score)&&x.score>=0).sort((a,b)=>b.score-a.score).slice(0,10)}catch(e){scoresWritable=false}return sessionScores;
}
function renderScoreboards(){
 const scores=readScores();for(const id of ["homeLeaderboard","leaderboard"]){
  const target=el(id);target.replaceChildren(makeTable(["Rank","Player","Score","Rating"],scores.map((x,i)=>[i+1,x.name,x.score,x.tier||""])));
  if(!scores.length){const note=document.createElement("p");note.textContent="No scores yet. Finish a game to join the scoreboard.";target.append(note)}
  if(!scoresWritable){const note=document.createElement("p");note.textContent="Browser storage is unavailable. Scores will remain only while this page stays open.";target.append(note)}
 }
}

function startGame(){
 initAudio(); saveSettings(); makePrompts(); clearTimeout(advance); idx=0; total=0; scoreSaved=false; history=[]; usedAnswers=new Set();
 home.style.display="none"; game.style.display="block"; end.style.display="none"; el("results").replaceChildren();
 
 bgGradients = []; gridGradients = []; gridSizes = []; gridPositions = [];
 document.getElementById("sec-bg").innerHTML = ""; 
 buildBackground(0); 
 
 showPrompt();
}

function showPrompt(){
 clearInterval(tick);if(idx>=cfg.count){finish();return}
 answered=false;left=25;round.style.display=prompt.style.display=timer.style.display="";el("answerPanel").style.display="block";document.querySelector(".controls").style.display="flex";
 timer.classList.remove("timer-danger"); prompt.classList.remove("pop-in"); void prompt.offsetWidth; prompt.classList.add("pop-in");
 round.textContent=`${cfg.players.trim()||"Player"} · QUESTION ${idx+1} / ${cfg.count}`;prompt.textContent=prompts[idx];timer.textContent=left;scoreText.textContent=`SCORE ${total}`;
 el("answer").value="";el("answer").disabled=false;el("feedback").textContent="";
 el("submitAnswer").disabled=false;el("answer").focus();
 tick=setInterval(()=>{
     left--;timer.textContent=left;
     if(left <= 5 && left > 0 && !answered) { timer.classList.add("timer-danger"); sfxTick(); }
     if(left<=0) submitAnswer(true);
 },1000);
}

function submitAnswer(timedOut=false){
 if(answered)return;
 const value=el("answer").value.trim();
 if(!value && !timedOut){ el("feedback").textContent="Enter an answer before submitting."; return; }
 const rating=gradeAnswer(value); const answerKey=prompts[idx]+"|"+rating.key; const repeated=rating.key&&usedAnswers.has(answerKey);
 if (!timedOut && (rating.level < 0 || repeated) && value) {
     sfxBad(); triggerFlash(repeated ? "#ffb6c4" : "#ff4f70"); triggerShake();
     el("feedback").textContent = repeated ? "Already guessed that! Try again!" : `"${value}" not found. Try again!`;
     el("feedback").style.color = repeated ? "#ffb6c4" : "#ff4f70";
     el("answer").value = ""; el("answer").focus(); return;
 }
 answered=true; clearInterval(tick);
 if(repeated)rating.points=0; if(rating.key)usedAnswers.add(answerKey);
 total+=rating.points;
 history.push({question:prompts[idx],answer:value||"No answer",tier:value?rating.tier:"Unanswered",points:rating.points});
 
 triggerShake();
 if (rating.points > 0 && !repeated) {
     sfxGood((rating.level + 1)); spawnPointsText(`+${rating.points}`, rating.color); triggerFlash(rating.color); 
     triggerSecurityVisual(rating.level, rating.color);
     spawnPersistentData(rating.level, rating.color);
     buildBackground(rating.level); 
     
     const textContainer = document.querySelector(".depth"); textContainer.style.transform = "scale(1.2)"; setTimeout(()=> textContainer.style.transform = "scale(1)", 200);
 } else { sfxBad(); triggerFlash(repeated ? "#ffb6c4" : "#ff4f70"); }
 el("feedback").textContent=`${timedOut?"Time's up! ":""}${value?rating.tier:"Unanswered"} · +${rating.points} points${repeated?" · Repeated answer":rating.matched?" · Matched: "+rating.matched:""}`;
 el("feedback").style.color=rating.color; el("feedback").classList.remove("pop-in"); void el("feedback").offsetWidth; el("feedback").classList.add("pop-in");
 scoreText.textContent=`SCORE ${total}`;el("answer").disabled=true;el("submitAnswer").disabled=true;advance=setTimeout(nextPrompt,2000);
}

function nextPrompt(){if(!answered)return;idx++;showPrompt()}
function makeTable(headers,rows){
 const table=document.createElement("table"),caption=document.createElement("caption");caption.textContent=headers[0]==="Rank"?"TOP SCORES · THIS BROWSER":"THIS GAME";table.append(caption);
 const head=document.createElement("thead"),tr=document.createElement("tr");headers.forEach(text=>{const th=document.createElement("th");th.scope="col";th.textContent=text;tr.append(th)});head.append(tr);table.append(head);
 const body=document.createElement("tbody");rows.forEach(values=>{const row=document.createElement("tr");values.forEach(text=>{const cell=document.createElement("td");cell.textContent=text;row.append(cell)});body.append(row)});table.append(body);return table;
}
function finish(){
 clearInterval(tick);round.style.display=prompt.style.display=timer.style.display=el("answerPanel").style.display="none";document.querySelector(".controls").style.display="none";
 const tier=total>=900?"Legendary":total>=700?"Epic":total>=450?"Rare":total>=200?"Uncommon":"Common";
 endDepth.textContent=`${cfg.players.trim()||"Player"} · ${tier} · ${total} points`;
 if(!scoreSaved){
  const scores=[...readScores(),{name:cfg.players.trim()||"Player",score:total,tier}].sort((a,b)=>b.score-a.score).slice(0,10);sessionScores=scores;
  try{localStorage.setItem("securityDebugScoresV1",JSON.stringify(scores));scoresWritable=true}catch(e){scoresWritable=false}
  scoreSaved=true;
 }
 renderScoreboards();
 el("results").replaceChildren(makeTable(["Round","Question","Answer","Rarity","Points"],history.map((h,i)=>[i+1,h.question,h.answer,h.tier,h.points])));
 
 const allAnsDiv = el("allAnswers");
 allAnsDiv.replaceChildren();
 history.forEach((h, i) => {
     const details = document.createElement("details");
     details.className = "answer-reveal";
     const summary = document.createElement("summary");
     summary.textContent = `ROUND ${i+1}: ${h.question}`;
     details.appendChild(summary);
     
     const qIndex = questionOrder.indexOf(h.question);
     const tiers = answerBank[qIndex] || [];
     
     tiers.forEach((group, level) => {
         const row = document.createElement("div");
         row.className = "reveal-tier";
         const nameSpan = document.createElement("span");
         nameSpan.className = "reveal-tier-name";
         nameSpan.style.color = tierColors[level];
         nameSpan.textContent = tierNames[level];
         
         const itemsSpan = document.createElement("span");
         itemsSpan.className = "reveal-tier-items";
         itemsSpan.textContent = group.split("|").join(", ");
         
         row.appendChild(nameSpan);
         row.appendChild(itemsSpan);
         details.appendChild(row);
     });
     allAnsDiv.appendChild(details);
 });
 
 end.style.display="block";
}
function quit(){clearInterval(tick);clearTimeout(advance);renderScoreboards();game.style.display="none";home.style.display="flex";end.style.display="none"}
load();renderScoreboards();
</script></body></html>
