function normalizeAnswer(value){return value.normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"")}
let scoreSaved=false;
function editDistance(a,b){
 const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
 for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
 }return d[a.length][b.length];
}
function gradeAnswer(value,question=prompts[idx]){
 const key=normalizeAnswer(value), tiers=answerBank[questionOrder.indexOf(question)]||[];
 const entries=tiers.flatMap((group,level)=>group.split("|").map(alias=>({alias,level,key:normalizeAnswer(alias)})));
 let match=key?entries.find(e=>e.key===key):null;
 const words=value.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[];
 const fillers=new Set(["i","would","say","use","a","an","the","my","answer","is","its","it","maybe"]);
 const clean=words.filter(w=>!fillers.has(w));const cleanKey=clean.join("");
 if(!match&&cleanKey)match=entries.find(e=>e.key===cleanKey);
 if(!match&&key){
  // Accept whole answer names within short phrases, never arbitrary substrings.
  const phrase=" "+words.join(" ")+" ";
  const contained=entries.filter(e=>e.key.length>=4&&phrase.includes(" "+(e.alias.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).join(" ")+" "));
  if(contained.length){contained.sort((a,b)=>b.key.length-a.key.length||a.level-b.level);match=contained[0]}
 }
 if(!match&&cleanKey.length>=4){
  const candidates=entries.map(e=>{const distance=editDistance(cleanKey,e.key);const allowed=Math.min(cleanKey.length,e.key.length)>=8?2:1;
   const prefix=Math.min(cleanKey.length,e.key.length)>=5&&(e.key.startsWith(cleanKey)||cleanKey.startsWith(e.key))&&Math.min(cleanKey.length,e.key.length)/Math.max(cleanKey.length,e.key.length)>=.5;
   return {...e,distance,valid:e.key.length>=4&&((distance<=allowed&&distance/Math.max(cleanKey.length,e.key.length)<=.25)||prefix)};
  }).filter(e=>e.valid).sort((a,b)=>a.distance-b.distance||a.level-b.level);
  if(candidates.length)match=candidates[0];
 }

}

function readScores(){
 if(!scoresWritable)return sessionScores;
 try{const saved=JSON.parse(localStorage.getItem("securityDebugScoresV1")||"[]");if(Array.isArray(saved))sessionScores=saved.filter(x=>x&&typeof x.name==="string"&&Number.isFinite(x.score)&&x.score>=0).sort((a,b)=>b.score-a.score).slice(0,10)}catch(e){scoresWritable=false}return sessionScores;
}
function renderScoreboards(){
 const scores=readScores();for(const id of ["homeLeaderboard","leaderboard"]){
  const target=el(id);target.replaceChildren(makeTable(["Rank","Player","Score","Rating"],scores.map((x,i)=>[i+1,x.name,x.score,x.tier||""])));
  if(!scores.length){const note=document.createElement("p");note.textContent="No scores yet. Finish a game to join the scoreboard.";target.append(note)}
  if(!scoresWritable){const note=document.createElement("p");note.textContent="Browser storage is unavailable. Scores will remain only while this page stays open.";target.append(note)}
 }
}
function startGame(){saveSettings();makePrompts();clearTimeout(advance);idx=0;total=0;scoreSaved=false;history=[];usedAnswers=new Set();home.style.display="none";game.style.display="block";end.style.display="none";el("results").replaceChildren();showPrompt()}
function showPrompt(){
 clearInterval(tick);if(idx>=cfg.count){finish();return}
 answered=false;left=25;round.style.display=prompt.style.display=timer.style.display="";el("answerPanel").style.display="block";document.querySelector(".controls").style.display="flex";
 round.textContent=`${cfg.players.trim()||"Player"} · QUESTION ${idx+1} / ${cfg.count}`;prompt.textContent=prompts[idx];timer.textContent=left;depth.textContent=`SCORE ${total}`;
 el("answer").value="";el("answer").disabled=false;el("feedback").textContent="";
 el("submitAnswer").disabled=false;el("answer").focus();
 tick=setInterval(()=>{left--;timer.textContent=left;if(left<=0)submitAnswer(true)},1000);
}
function submitAnswer(timedOut=false){
 if(answered)return;
 const value=el("answer").value.trim();if(!value&&!timedOut){el("feedback").textContent="Enter an answer before submitting.";return}
 answered=true;clearInterval(tick);const rating=gradeAnswer(value);const answerKey=prompts[idx]+"|"+rating.key;const repeated=rating.key&&usedAnswers.has(answerKey);if(repeated)rating.points=0;if(rating.key)usedAnswers.add(answerKey);total+=rating.points;
 history.push({question:prompts[idx],answer:value||"No answer",tier:value?rating.tier:"Unanswered",points:rating.points});
 el("feedback").textContent=`${timedOut?"Time's up! ":""}${value?rating.tier:"Unanswered"} · +${rating.points} points${repeated?" · Repeated answer":rating.matched?" · Matched: "+rating.matched:""}`;el("feedback").style.color=rating.color;
 depth.textContent=`SCORE ${total}`;el("answer").disabled=true;el("submitAnswer").disabled=true;advance=setTimeout(nextPrompt,1800);
}
function nextPrompt(){if(!answered)return;idx++;showPrompt()}
function makeTable(headers,rows){
 const table=document.createElement("table"),caption=document.createElement("caption");caption.textContent=headers[0]==="Rank"?"TOP SCORES · THIS BROWSER":"THIS GAME";table.append(caption);
 const head=document.createElement("thead"),tr=document.createElement("tr");headers.forEach(text=>{const th=document.createElement("th");th.scope="col";th.textContent=text;tr.append(th)});head.append(tr);table.append(head);
 const body=document.createElement("tbody");rows.forEach(values=>{const row=document.createElement("tr");values.forEach(text=>{const cell=document.createElement("td");cell.textContent=text;row.append(cell)});body.append(row)});table.append(body);return table;
}
function finish(){
 clearInterval(tick);round.style.display=prompt.style.display=timer.style.display=el("answerPanel").style.display="none";document.querySelector(".controls").style.display="none";
 const tier=total>=900?"Legendary":total>=700?"Epic":total>=450?"Rare":total>=200?"Uncommon":"Common";
 endDepth.textContent=`${cfg.players.trim()||"Player"} · ${tier} · ${total} points`;
 if(!scoreSaved){
  const scores=[...readScores(),{name:cfg.players.trim()||"Player",score:total,tier}].sort((a,b)=>b.score-a.score).slice(0,10);sessionScores=scores;
  try{localStorage.setItem("securityDebugScoresV1",JSON.stringify(scores));scoresWritable=true}catch(e){scoresWritable=false}
  scoreSaved=true;
 }
 renderScoreboards();
 el("results").replaceChildren(makeTable(["Round","Question","Answer","Rarity","Points"],history.map((h,i)=>[i+1,h.question,h.answer,h.tier,h.points])));end.style.display="block";
}
function quit(){clearInterval(tick);clearTimeout(advance);renderScoreboards();game.style.display="none";home.style.display="flex";end.style.display="none"}
load();renderScoreboards();
</script></body></html>
